# Parameters of autoassess_bridge_node (private namespace). CDF credentials are NOT set here:
# export COGNITE_PROJECT, COGNITE_CLUSTER, COGNITE_TENANT_ID, COGNITE_CLIENT_ID and
# COGNITE_CLIENT_SECRET in the environment that starts the node.
area_external_id: ""            # required: externalId of the AutoAssess area to follow
space: autoassess               # CDF data-model space of the AutoAssess instances
poll_period_s: 10.0             # how often to poll CDF
frame_id: world                 # frame of /autoassess/inspection_targets (plan map frame)
standoff_m: 0.8                 # distance of each inspection pose from its target
set_global_bound: true          # send the area box to the planner's global-bound service
bound_margin_m: 0.3             # padding around the area's structural-element centres
global_bound_service: gbplanner/set_global_bound
service_timeout_s: 5.0          # wait per tick for the service before retrying next tick

# Mission upload (the only CDF writes; off by default). Needs write access, see README.
upload_enabled: false           # upload the finished mission as CogniteFiles + a campaign
upload_on_mission_end: true     # also upload automatically when the mission looks finished
mesh_filename: ""               # same path as gbplanner_node's mesh_filename param ("" = no mesh)
generate_mesh_service: /gbplanner_node/generate_mesh
mesh_timeout_s: 30.0            # wait for the mesh file after generate_mesh
mission_dir: ""                 # folder whose .ply/.pcd files are uploaded too ("" = none)
mission_end_quiet_s: 10.0       # no new /gbplanner_path for this long after homing ...
mission_end_max_speed: 0.1      # ... and odometry speed (m/s) at most this -> mission finished
path_topic: /gbplanner_path
homing_topic: /gbplanner_is_homing
